<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipSave</title>
    <link rel="stylesheet" href="style.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <header class="app-header">
      <h1>ClipSave</h1>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle light or dark theme"></button>
        <button class="delete-all" title="Delete all clips">Clear all</button>
      </div>
    </header>

    <nav class="tab-bar" id="tabBar">
      <button class="tab active" data-tab="all">All</button>
      <button class="tab" data-tab="recent">Recent</button>
      <button class="tab" data-tab="frequent">Frequent</button>
      <button class="tab" data-tab="fav">★ Fav</button>
      <button class="tab" data-tab="groups">Groups</button>
      <button class="tab tab-icon" data-tab="settings" title="Settings" aria-label="Settings">⚙</button>
    </nav>

    <!-- Clip tabs: all / recent / frequent / fav -->
    <section id="clipView">
      <div class="input-container">
        <input
          type="text"
          id="new-item"
          placeholder="Add new item or paste from clipboard"
        />
        <button id="add-btn">Add</button>
      </div>
      <div class="search-container">
        <input type="text" id="search" placeholder="Search clips…" />
        <button id="clear-search-btn" title="Clear search" aria-label="Clear search">×</button>
      </div>
      <ul id="clipboardList"></ul>
    </section>

    <!-- Groups tab -->
    <section id="groupsView" class="hidden">
      <div class="input-container">
        <input type="text" id="new-group" placeholder="New group name…" />
        <button id="add-group-btn">Create</button>
      </div>
      <div id="groupList"></div>
    </section>

    <!-- Settings tab (rendered by popup.js) -->
    <section id="settingsView" class="hidden"></section>

    <script src="popup.js"></script>
  </body>
</html>
